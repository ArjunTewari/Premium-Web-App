kind = "web"
previewPath = "/"
title = "Emerald AI — AQ Intelligence Platform"
version = "1.0.0"
id = "artifacts/emerald-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21680

[services.development]
run = "pnpm --filter @workspace/emerald-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/emerald-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/emerald-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21680"
BASE_PATH = "/"
