kind = "web"
previewPath = "/"
title = "Emerald AI"
version = "1.0.0"
id = "artifacts/emerald-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21680

[services.development]
run = "pnpm --filter @workspace/emerald-web run dev"

[services.production]
serve = "static"
publicDir = "artifacts/emerald-web/dist"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/emerald-web", "run", "build"]

[services.env]
PORT = "21680"
BASE_PATH = "/"
